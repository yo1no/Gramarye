name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P0 platform baseline
        run: ./gradlew verifyPlatformBaseline

      - name: Compile production sources
        run: ./gradlew compileJava

      - name: Run Java unit tests
        run: ./gradlew test

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Run dedicated-server smoke test
        env:
          GRAMARYE_SERVER_SMOKE_TIMEOUT_SECONDS: '180'
        run: ./scripts/run-dedicated-server-smoke.sh
