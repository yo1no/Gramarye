name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P0 platform baseline
        run: ./gradlew verifyPlatformBaseline

      - name: Compile production sources
        run: ./gradlew compileJava

      - name: Run Java unit tests
        run: ./gradlew test

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Run dedicated-server smoke test
        env:
          GRAMARYE_SERVER_SMOKE_TIMEOUT_SECONDS: '180'
        run: ./scripts/run-dedicated-server-smoke.sh

  p4-a3-memory-gates:
    name: P4-A3 memory gates
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P4-A3 task and isolation contracts
        timeout-minutes: 2
        run: ./gradlew --no-daemon --console=plain verifyP4A3BConfiguration

      - name: Run plain fixed-heap carrier probes
        timeout-minutes: 5
        run: ./gradlew --no-daemon --console=plain p4A3HeapProbe

      - name: Run dedicated fixed-heap RegistryOps probe
        timeout-minutes: 6
        run: ./gradlew --no-daemon --console=plain runP4A3HeapProbeServer

  p4-b-memory-gates:
    name: P4-B memory gates
    needs:
      - build
      - p4-a3-memory-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P4-B2-B task and isolation contracts
        timeout-minutes: 3
        run: ./gradlew --no-daemon --console=plain verifyP4B2Configuration

      - name: Run P4-B2-B fixed-heap valid, hostile-FNAME, and quarantine restart gates
        timeout-minutes: 26
        run: ./gradlew --no-daemon --console=plain p4B2FixedHeapGate

  p4-c-memory-gates:
    name: P4-C memory gates
    needs:
      - build
      - p4-a3-memory-gates
      - p4-b-memory-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P4-C2-B task and isolation contracts
        timeout-minutes: 3
        run: ./gradlew --no-daemon --console=plain verifyP4C2Configuration

      - name: Run P4-C2-B fixed-heap playerdata lifecycle gates
        timeout-minutes: 26
        run: ./gradlew --no-daemon --console=plain p4C2FixedHeapGate

  p4-d-memory-gates:
    name: P4-D memory gates
    needs:
      - build
      - p4-a3-memory-gates
      - p4-b-memory-gates
      - p4-c-memory-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P4-D3-B task and isolation contracts
        timeout-minutes: 3
        run: ./gradlew --no-daemon --console=plain verifyP4D3Configuration

      - name: Run P4-D3-B crash/restart and combined fixed-heap gates
        timeout-minutes: 40
        run: ./gradlew --no-daemon --console=plain p4D3FixedHeapGate
