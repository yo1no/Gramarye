name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and qualify production and test warnings
        id: warning-compile
        env:
          GRAMARYE_P9_S4_WARNING_ROOT: ${{ runner.temp }}/gramarye-p9-s4-wc1-warning-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          warning_root="${GRAMARYE_P9_S4_WARNING_ROOT}"
          if [[ -e "${warning_root}" || -L "${warning_root}" ]]; then
            printf 'P9-S4-WC1 warning root already exists\n' >&2
            exit 2
          fi
          mkdir -p "${warning_root}/metadata" "${warning_root}/raw" "${warning_root}/results"
          raw_java_home="${JAVA_HOME-}"
          if [[ -z "${raw_java_home}" ]]; then
            printf 'P9-S4 Java-home handoff rejected: JAVA_HOME is missing or empty\n' >&2
            exit 2
          fi
          canonical_java_home="$(
            RAW_JAVA_HOME="${raw_java_home}" python3 - <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          def reject(message: str) -> None:
              print(f"P9-S4 Java-home handoff rejected: {message}", file=sys.stderr)
              raise SystemExit(2)

          raw = os.environ.get("RAW_JAVA_HOME")
          if raw is None or raw == "":
              reject("JAVA_HOME is missing or empty")
          if "\r" in raw or "\n" in raw:
              reject("JAVA_HOME contains CR or LF")
          try:
              raw.encode("utf-8", "strict")
          except UnicodeEncodeError:
              reject("JAVA_HOME is not strict UTF-8")
          raw_path = Path(raw)
          if not raw_path.is_absolute():
              reject("JAVA_HOME is not absolute")
          try:
              canonical_path = raw_path.resolve(strict=True)
              canonical_info = canonical_path.lstat()
              same_target = raw_path.samefile(canonical_path)
          except (OSError, RuntimeError, ValueError) as error:
              reject(f"JAVA_HOME cannot be resolved strictly: {type(error).__name__}")
          if not stat.S_ISDIR(canonical_info.st_mode):
              reject("resolved JAVA_HOME is not a directory")
          if not same_target:
              reject("raw and canonical JAVA_HOME identify different directories")
          canonical = os.fspath(canonical_path)
          if canonical == "" or "\r" in canonical or "\n" in canonical:
              reject("canonical JAVA_HOME is empty or contains CR or LF")
          try:
              canonical.encode("utf-8", "strict")
          except UnicodeEncodeError:
              reject("canonical JAVA_HOME is not strict UTF-8")
          sys.stdout.write(canonical)
          PY
          )"
          if [[ -z "${canonical_java_home}" \
                || "${canonical_java_home}" == *$'\r'* \
                || "${canonical_java_home}" == *$'\n'* ]]; then
            printf 'P9-S4 Java-home handoff rejected: canonical output is unsafe\n' >&2
            exit 2
          fi
          if [[ -z "${GITHUB_OUTPUT-}" ]]; then
            printf 'P9-S4 Java-home handoff rejected: GITHUB_OUTPUT is missing or empty\n' >&2
            exit 2
          fi
          printf 'P9-S4 Java-home handoff raw=%q canonical=%q\n' \
            "${raw_java_home}" "${canonical_java_home}"
          printf 'canonical_java_home=%s\n' "${canonical_java_home}" \
            >> "${GITHUB_OUTPUT}"
          printf '%s\n' \
            ./gradlew \
            --no-daemon \
            verifyPlatformBaseline \
            compileJava \
            compileTestJava \
            --rerun-tasks \
            --warning-mode=all \
            --console=plain \
            > "${warning_root}/metadata/compile-command.argv"
          printf 'commit:%s\n' "${GITHUB_SHA}" \
            > "${warning_root}/metadata/source-identity.txt"
          set +e
          ./gradlew --no-daemon \
            verifyPlatformBaseline compileJava compileTestJava \
            --rerun-tasks --warning-mode=all --console=plain \
            2>&1 | tee "${warning_root}/raw/gradle-compile.log"
          compile_pipeline_status=("${PIPESTATUS[@]}")
          compile_gradle_exit="${compile_pipeline_status[0]}"
          compile_tee_exit="${compile_pipeline_status[1]}"
          set -e
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          set +e
          python3 ./scripts/verify-p9-s4-warning-attribution.py \
            compile \
            --project-root "${GITHUB_WORKSPACE}" \
            --raw-log "${warning_root}/raw/gradle-compile.log" \
            --result "${warning_root}/results/compile-warning-attribution.json" \
            --campaign P9-S4-WC1-WARNING-ATTRIBUTION-FRESH-QUALIFICATION \
            --source-identity "commit:${GITHUB_SHA}" \
            --commit "${GITHUB_SHA}" \
            --tree "${source_tree}" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --job "${GITHUB_JOB}" \
            --java-home "${canonical_java_home}" \
            --main-output "${GITHUB_WORKSPACE}/build/classes/java/main" \
            --test-output "${GITHUB_WORKSPACE}/build/classes/java/test"
          attribution_exit="$?"
          set -e
          printf 'GRADLE_EXIT_CODE=%s\nTEE_EXIT_CODE=%s\nATTRIBUTION_EXIT_CODE=%s\n' \
            "${compile_gradle_exit}" "${compile_tee_exit}" "${attribution_exit}" \
            > "${warning_root}/metadata/compile-exit.properties"
          if [[ "${compile_gradle_exit}" != '0' \
                || "${compile_tee_exit}" != '0' \
                || "${attribution_exit}" != '0' ]]; then
            exit 1
          fi

      - name: Run Java unit tests
        id: unit-rd1
        env:
          GRAMARYE_RD1_DIAGNOSTIC_ROOT: ${{ runner.temp }}/gramarye-p9-s3-rd1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash ./scripts/run-p9-s3-rd1-unit-test-diagnostics.sh

      - name: Attribute unit compiler task states
        if: ${{ always() && steps.warning-compile.outcome == 'success' && steps.unit-rd1.outcome != 'skipped' }}
        env:
          GRAMARYE_RD1_DIAGNOSTIC_ROOT: ${{ runner.temp }}/gramarye-p9-s3-rd1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          GRAMARYE_P9_S4_WARNING_ROOT: ${{ runner.temp }}/gramarye-p9-s4-wc1-warning-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          GRAMARYE_P9_S4_CANONICAL_JAVA_HOME: ${{ steps.warning-compile.outputs.canonical_java_home }}
        run: |
          if [[ -z "${GRAMARYE_P9_S4_CANONICAL_JAVA_HOME-}" \
                || "${GRAMARYE_P9_S4_CANONICAL_JAVA_HOME}" == *$'\r'* \
                || "${GRAMARYE_P9_S4_CANONICAL_JAVA_HOME}" == *$'\n'* ]]; then
            printf 'P9-S4 Java-home handoff rejected: compile-step output is missing, empty, or unsafe\n' >&2
            exit 2
          fi
          python3 ./scripts/verify-p9-s4-warning-attribution.py \
            unit \
            --project-root "${GITHUB_WORKSPACE}" \
            --raw-log "${GRAMARYE_RD1_DIAGNOSTIC_ROOT}/raw/gradle-test.log" \
            --result "${GRAMARYE_P9_S4_WARNING_ROOT}/results/unit-warning-attribution.json" \
            --campaign P9-S4-WC1-WARNING-ATTRIBUTION-FRESH-QUALIFICATION \
            --source-identity "commit:${GITHUB_SHA}" \
            --commit "${GITHUB_SHA}" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --job "${GITHUB_JOB}" \
            --java-home "${GRAMARYE_P9_S4_CANONICAL_JAVA_HOME}" \
            --main-output "${GITHUB_WORKSPACE}/build/classes/java/main" \
            --test-output "${GITHUB_WORKSPACE}/build/classes/java/test" \
            --compile-proof "${GRAMARYE_P9_S4_WARNING_ROOT}/results/compile-warning-attribution.json"

      - name: Collect Java test-worker diagnostics
        id: rd1-collect
        if: ${{ always() }}
        env:
          GRAMARYE_RD1_DIAGNOSTIC_ROOT: ${{ runner.temp }}/gramarye-p9-s3-rd1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          GRAMARYE_P9_S4_WARNING_ROOT: ${{ runner.temp }}/gramarye-p9-s4-wc1-warning-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash ./scripts/collect-p9-s3-rd1-unit-test-diagnostics.sh

      - name: Upload Java test-worker diagnostics
        if: ${{ always() && steps.rd1-collect.outputs.safe_to_upload == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p9-s3-rd1-test-worker-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ steps.rd1-collect.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Run isolated P8-S2 reload GameTest
        run: bash ./scripts/run-p8-s2-reload-gametest.sh

      - name: Run dedicated-server smoke test
        env:
          GRAMARYE_SERVER_SMOKE_TIMEOUT_SECONDS: '180'
        run: ./scripts/run-dedicated-server-smoke.sh

  p4-a3-memory-gates:
    name: P4-A3 memory gates
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P4-A3 task and isolation contracts
        timeout-minutes: 2
        run: ./gradlew --no-daemon --console=plain verifyP4A3BConfiguration

      - name: Run plain fixed-heap carrier probes
        timeout-minutes: 5
        run: ./gradlew --no-daemon --console=plain p4A3HeapProbe

      - name: Run dedicated fixed-heap RegistryOps probe
        timeout-minutes: 6
        run: ./gradlew --no-daemon --console=plain runP4A3HeapProbeServer

  p4-b-memory-gates:
    name: P4-B memory gates
    needs:
      - build
      - p4-a3-memory-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P4-B2-B task and isolation contracts
        timeout-minutes: 3
        run: ./gradlew --no-daemon --console=plain verifyP4B2Configuration

      - name: Run P4-B2-B fixed-heap valid, hostile-FNAME, and quarantine restart gates
        timeout-minutes: 26
        run: ./gradlew --no-daemon --console=plain p4B2FixedHeapGate

  p4-c-memory-gates:
    name: P4-C memory gates
    needs:
      - build
      - p4-a3-memory-gates
      - p4-b-memory-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P4-C2-B task and isolation contracts
        timeout-minutes: 3
        run: ./gradlew --no-daemon --console=plain verifyP4C2Configuration

      - name: Run P4-C2-B fixed-heap playerdata lifecycle gates
        timeout-minutes: 26
        run: ./gradlew --no-daemon --console=plain p4C2FixedHeapGate

  p4-d-memory-gates:
    name: P4-D memory gates
    needs:
      - build
      - p4-a3-memory-gates
      - p4-b-memory-gates
      - p4-c-memory-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify P4-D3-B task and isolation contracts
        timeout-minutes: 3
        run: ./gradlew --no-daemon --console=plain verifyP4D3Configuration

      - name: Run P4-D3-B crash/restart and combined fixed-heap gates
        timeout-minutes: 40
        run: ./gradlew --no-daemon --console=plain p4D3FixedHeapGate

  p4-e-memory-gates:
    name: P4-E memory gates
    needs:
      - build
      - p4-a3-memory-gates
      - p4-b-memory-gates
      - p4-c-memory-gates
      - p4-d-memory-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run P4-E3 closed-startup fixed-heap Gate
        timeout-minutes: 40
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks --console=plain p4E3FixedHeapGate
