}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def serverGameDirectory = providers.environmentVariable('GRAMARYE_SERVER_GAME_DIR').orElse('run/server')
def commonsCompressVersion = providers.gradleProperty('commons_compress_version').get()
def commonsCompressCoordinate =
        "org.apache.commons:commons-compress:${commonsCompressVersion}"
def p4E3GameDirectory = layout.buildDirectory.dir('p4-e3/fixed-heap-world')
def p4E3CommandDirectory = layout.buildDirectory.dir('p4-e3/command-work')
def p4E3ReportDirectory = layout.buildDirectory.dir('reports/p4-e3-fixed-heap')

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // These isolated source sets still need the locked Minecraft/NeoForge compile surface.
    addModdingDependenciesTo(p4A3ProbeSourceSet)
    addModdingDependenciesTo(p4A3GameTestSourceSet)
    addModdingDependenciesTo(p4B2ProbeSourceSet)
    addModdingDependenciesTo(p4B2GameTestSourceSet)
    addModdingDependenciesTo(p4C2ProbeSourceSet)
    addModdingDependenciesTo(p4C2GameTestSourceSet)
    addModdingDependenciesTo(p4D3ProbeSourceSet)
    addModdingDependenciesTo(p4D3GameTestSourceSet)
    addModdingDependenciesTo(p4E3ProbeSourceSet)
    addModdingDependenciesTo(p4E3GameTestSourceSet)
    addModdingDependenciesTo(p4E0ResearchSourceSet)
    addModdingDependenciesTo(p4E0ResearchGameTestSourceSet)

    mods {
        // Production runs and the published JAR contain only main.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }

        // Normal JUnit regression tests can exercise lightweight probe helpers without making
        // those helpers part of production runs or the production JAR.
        p4A3ProbeTestSupport {
            sourceSet(sourceSets.main)
            sourceSet(p4A3ProbeSourceSet)
            sourceSet(p4B2ProbeSourceSet)
            sourceSet(p4C2ProbeSourceSet)
            sourceSet(p4D3ProbeSourceSet)
            sourceSet(p4E0ResearchSourceSet)
        }

