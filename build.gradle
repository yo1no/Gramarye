        def classifyTaskName = "classifyP4E0ResearchCombined${token}"
        def childReport = layout.buildDirectory.file(
                "reports/p4-e0-research/combined-child/${evidenceStem}.json")
        def exitFile = layout.buildDirectory.file(
                "reports/p4-e0-research/process/"
                        + "${researchRunIndex}.exit-code.txt")
        def runningMarker = layout.buildDirectory.file(
                "reports/p4-e0-research/combined-running/${evidenceStem}.marker")
        def combinedWorldDirectory = layout.buildDirectory.dir(
                "p4-e0-research/r2/combined-worlds/${profileId}-${heapMiB}")
        def prerequisiteTask = previousP4E0ResearchR2Task
        tasks.named(prepareRunTaskName).configure {
            outputs.upToDateWhen { false }
        }
        def runTask = tasks.named(runTaskName, JavaExec)
        runTask.configure {
            dependsOn(prerequisiteTask)
            javaLauncher.set(p4A3JavaLauncher)
            timeout.set(java.time.Duration.ofSeconds(
                    p4E0ResearchR2CombinedTimeoutSeconds))
            ignoreExitValue = true
            doFirst {
                resetExactP4E0ResearchR2CombinedWorld(
                        combinedWorldDirectory.get().asFile, true)
                [childReport, exitFile, runningMarker].each { output ->
                    output.get().asFile.delete()
                    output.get().asFile.parentFile.mkdirs()
                }
            }
            doLast {
                exitFile.get().asFile.setText(
                        executionResult.get().exitValue.toString()
                                + System.lineSeparator(),
                        'US-ASCII')
            }
            outputs.upToDateWhen { false }
        }
        def classifyTask = registerP4E0ResearchR2Command(
                classifyTaskName,
                'classify-combined',
                "Classifies P4-E0-R2 ${profileId} at ${heapMiB} MiB from disk evidence.",
                [
                        researchRunIndex.toString(),
                        p4E0ResearchR2FixtureDirectory.get().asFile.absolutePath,
                        p4E0ResearchReportDirectory.get().asFile.absolutePath,
                        exitFile.get().asFile.absolutePath,
                        runningMarker.get().asFile.absolutePath,
                        p4E0ResearchDiskBudgetBytes,
                ])
        classifyTask.configure {
            dependsOn(runTask)
            doLast {
                resetExactP4E0ResearchR2CombinedWorld(
                        combinedWorldDirectory.get().asFile, false)
            }
        }
        previousP4E0ResearchR2Task = classifyTask
}

