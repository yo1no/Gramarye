def p4E0ResearchR2MainClass =
        'com.yo1no.gramarye.magic.definition.research.P4E0ResearchR2Main'
def p4E0ResearchR2CombinedTimeoutSeconds = 900
def p4E0ResearchR2WatchdogSeconds = 870
if (p4E0ResearchR2CombinedTimeoutSeconds > 900
        || p4E0ResearchR2WatchdogSeconds >= p4E0ResearchR2CombinedTimeoutSeconds) {
    throw new GradleException('P4-E0-R2 dedicated timeout/watchdog is not fail-closed')
}
def resetExactP4E0ResearchR2CombinedWorld = {
        directory, recreate ->
    def root = p4E0ResearchR2CombinedWorldRoot.get().asFile.toPath()
            .toAbsolutePath().normalize()
    def target = directory.toPath().toAbsolutePath().normalize()
    if (target.parent != root || target.fileName.toString().isBlank()) {
        throw new GradleException(
                'P4-E0-R2 refused a non-isolated combined-world deletion')
    }
    if (java.nio.file.Files.exists(
            target, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
        def paths = java.nio.file.Files.walk(target)
        try {
            paths.sorted(java.util.Comparator.reverseOrder()).forEach { candidate ->
                java.nio.file.Files.delete(candidate)
            }
        } finally {
            paths.close()
        }
    }
    if (recreate) {
        java.nio.file.Files.createDirectories(target)
    }
}

