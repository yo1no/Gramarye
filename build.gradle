def p4E0R2QGitStatus = providers.exec {
    commandLine('git', 'status', '--porcelain=v2', '--untracked-files=all')
}.standardOutput.asText.map { output -> output.trim() }
def p4E0R2QGitDiff = providers.exec {
    commandLine('git', 'diff', '--exit-code')
    ignoreExitValue = true
}
def p4E0R2QGitCachedDiff = providers.exec {
    commandLine('git', 'diff', '--cached', '--exit-code')
    ignoreExitValue = true
}
def p4E0R2QGitUntracked = providers.exec {
    commandLine('git', 'ls-files', '--others', '--exclude-standard')
}.standardOutput.asText.map { output -> output.trim() }
def p4E0R2QGitBranch = providers.exec {
    commandLine('git', 'symbolic-ref', '--quiet', '--short', 'HEAD')
    ignoreExitValue = true
}
def p4E0R2QGitHead = providers.exec {
    commandLine('git', 'rev-parse', 'HEAD')
}.standardOutput.asText.map { output -> output.trim() }
def p4E0R2QGitTree = providers.exec {
    commandLine('git', 'rev-parse', 'HEAD^{tree}')
}.standardOutput.asText.map { output -> output.trim() }
def p4E0R2QOriginMain = providers.exec {
    commandLine('git', 'rev-parse', 'origin/main')
}.standardOutput.asText.map { output -> output.trim() }

def requireP4E0R2QFormalGate = {
    if (!p4E0R2QFormalMode.isPresent()
            || p4E0R2QFormalMode.get() != 'true') {
        throw new GradleException(
                'P4-E0-R2Q formal mode requires -Pp4E0R2QFormal=true')
    }
    if (!p4E0R2QFormalDiskBudget.isPresent()
            || p4E0R2QFormalDiskBudget.get() != p4E0R2QFormalDiskBudgetBytes) {
        throw new GradleException(
                'P4-E0-R2Q formal mode requires explicit '
                        + '-Pp4E0ResearchDiskBudgetBytes=12884901888')
    }
    if (!p4E0R2QGitStatus.get().isEmpty()
            || !p4E0R2QGitUntracked.get().isEmpty()
            || p4E0R2QGitDiff.result.get().exitValue != 0
            || p4E0R2QGitCachedDiff.result.get().exitValue != 0) {
        throw new GradleException(
                'P4-E0-R2Q formal mode requires a clean tracked tree, index, and untracked set')
    }
    if (p4E0R2QGitBranch.result.get().exitValue != 0
            || p4E0R2QGitBranch.standardOutput.asText.get().trim() != 'main') {
        throw new GradleException(
                'P4-E0-R2Q formal mode requires HEAD attached to main')
    }
    def head = p4E0R2QGitHead.get()
    def tree = p4E0R2QGitTree.get()
    def originMain = p4E0R2QOriginMain.get()
    if (!(head ==~ /[0-9a-f]{40}/)
            || !(tree ==~ /[0-9a-f]{40}/)
            || !(originMain ==~ /[0-9a-f]{40}/)
            || head != originMain) {
        throw new GradleException(
                'P4-E0-R2Q formal mode requires committed HEAD/tree at origin/main')
    }
}

def writeForcedP4E0R2QProcessMarker = { File target, String value ->
    def path = target.toPath().toAbsolutePath().normalize()
    java.nio.file.Files.createDirectories(path.parent)
    def bytes = java.nio.charset.StandardCharsets.US_ASCII.encode(value)
    def channel = java.nio.channels.FileChannel.open(
            path,
            java.nio.file.StandardOpenOption.CREATE_NEW,
            java.nio.file.StandardOpenOption.WRITE)
    try {
        while (bytes.hasRemaining()) {
            channel.write(bytes)
        }
        channel.force(true)
    } finally {
        channel.close()
    }
}

def prepareP4E0R2QFormalStudy = registerP4E0R2QFormalCommand(
        'prepareP4E0R2QFormalStudy',
