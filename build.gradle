def containedProbeMainClasses = [
        'com.yo1no.gramarye.magic.definition.store.P4A3HeapProbeMain',
        'com.yo1no.gramarye.magic.definition.store.P4B2ProbeMain',
        'com.yo1no.gramarye.magic.definition.player.P4C2ProbeMain',
        'com.yo1no.gramarye.magic.definition.store.P4D3ProbeMain',
] as Set
def configureProbeMainJavaExecOutputContainment = { JavaExec probeTask ->
    if (!containedProbeMainClasses.contains(probeTask.mainClass.get())) {
        throw new GradleException(
                "Refusing output containment for unreviewed JavaExec ${probeTask.name}")
    }
    def projectRootPathText = layout.projectDirectory.asFile.toPath()
            .toAbsolutePath().normalize().toString()
    def buildRootPathText = layout.buildDirectory.get().asFile.toPath()
            .toAbsolutePath().normalize().toString()
    def taskNameText = probeTask.name
    def taskDirectoryPathText = java.nio.file.Paths.get(buildRootPathText)
            .resolve('probe-runtime-working').resolve(taskNameText)
            .toAbsolutePath().normalize().toString()
    probeTask.workingDir(new java.io.File(taskDirectoryPathText))
    probeTask.doFirst(new ProbeRuntimeWorkingDirectoryAction(
            projectRootPathText,
            buildRootPathText,
            taskNameText,
            taskDirectoryPathText))
}
