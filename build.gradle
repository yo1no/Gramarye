        p4E0R2QFormalWorkDirectory.get().asFile.toPath().toAbsolutePath().normalize(),
        p4E0R2QFormalReportDirectory.get().asFile.toPath().toAbsolutePath().normalize(),
        p4E0R2QSmokeReportRootDirectory.get().asFile.toPath().toAbsolutePath().normalize(),
]
for (def leftIndex = 0; leftIndex < p4E0R2QConfiguredRootPaths.size(); leftIndex++) {
    for (def rightIndex = leftIndex + 1;
            rightIndex < p4E0R2QConfiguredRootPaths.size(); rightIndex++) {
        def left = p4E0R2QConfiguredRootPaths[leftIndex]
        def right = p4E0R2QConfiguredRootPaths[rightIndex]
        if (left == right || left.startsWith(right) || right.startsWith(left)) {
            throw new GradleException(
                    'P4-E0-R2Q official, smoke, and work roots must be pairwise disjoint')
        }
    }
}
