plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// P4-A3-B probe code is compiled separately from production and is never packaged by jar.
def p4A3ProbeSourceSet = sourceSets.create('p4A3Probe')
def p4A3GameTestSourceSet = sourceSets.create('p4A3GameTest')
def p4B2ProbeSourceSet = sourceSets.create('p4B2Probe')
def p4B2GameTestSourceSet = sourceSets.create('p4B2GameTest')
def p4C2ProbeSourceSet = sourceSets.create('p4C2Probe')
def p4C2GameTestSourceSet = sourceSets.create('p4C2GameTest')
def p4B2FixedHeapJvmArgs = [
        '-Xms512m',
        '-Xmx1024m',
        '-XX:+ExitOnOutOfMemoryError',
]
def p4C2FixedHeapJvmArgs = [
        '-Xms512m',
        '-Xmx1024m',
        '-XX:+ExitOnOutOfMemoryError',
]
def p4A3GameTestResources = tasks.register('generateP4A3GameTestResources', Sync) {
    dependsOn('createMinecraftArtifacts')
    from(zipTree(layout.buildDirectory.file(
            "moddev/artifacts/neoforge-${neo_version}-client-extra-aka-minecraft-resources.jar"))) {
        include 'data/minecraft/structure/bastion/blocks/air.nbt'
        eachFile { details ->
            details.path = 'data/gramarye_p4_a3/structure/p4_a3_probe.nbt'
        }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir('generated/p4A3GameTestResources'))
}
p4A3GameTestSourceSet.resources.srcDir(p4A3GameTestResources)
def p4B2GameTestResources = tasks.register('generateP4B2GameTestResources', Sync) {
    dependsOn('createMinecraftArtifacts')
    from(zipTree(layout.buildDirectory.file(
            "moddev/artifacts/neoforge-${neo_version}-client-extra-aka-minecraft-resources.jar"))) {
        include 'data/minecraft/structure/bastion/blocks/air.nbt'
        eachFile { details ->
            details.path = 'data/gramarye_p4_b2/structure/p4_b2_probe.nbt'
        }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir('generated/p4B2GameTestResources'))
}
p4B2GameTestSourceSet.resources.srcDir(p4B2GameTestResources)
def p4C2GameTestResources = tasks.register('generateP4C2GameTestResources', Sync) {
    dependsOn('createMinecraftArtifacts')
    from(zipTree(layout.buildDirectory.file(
            "moddev/artifacts/neoforge-${neo_version}-client-extra-aka-minecraft-resources.jar"))) {
        include 'data/minecraft/structure/bastion/blocks/air.nbt'
        eachFile { details ->
            details.path = 'data/gramarye_p4_c2/structure/p4_c2_probe.nbt'
        }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir('generated/p4C2GameTestResources'))
}
p4C2GameTestSourceSet.resources.srcDir(p4C2GameTestResources)

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def serverGameDirectory = providers.environmentVariable('GRAMARYE_SERVER_GAME_DIR').orElse('run/server')
def commonsCompressVersion = providers.gradleProperty('commons_compress_version').get()
def commonsCompressCoordinate =
        "org.apache.commons:commons-compress:${commonsCompressVersion}"

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // These isolated source sets still need the locked Minecraft/NeoForge compile surface.
    addModdingDependenciesTo(p4A3ProbeSourceSet)
    addModdingDependenciesTo(p4A3GameTestSourceSet)
    addModdingDependenciesTo(p4B2ProbeSourceSet)
    addModdingDependenciesTo(p4B2GameTestSourceSet)
    addModdingDependenciesTo(p4C2ProbeSourceSet)
    addModdingDependenciesTo(p4C2GameTestSourceSet)

    mods {
        // Production runs and the published JAR contain only main.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }

        // Normal JUnit regression tests can exercise lightweight probe helpers without making
        // those helpers part of production runs or the production JAR.
        p4A3ProbeTestSupport {
            sourceSet(sourceSets.main)
            sourceSet(p4A3ProbeSourceSet)
            sourceSet(p4B2ProbeSourceSet)
            sourceSet(p4C2ProbeSourceSet)
        }

        // Userdev treats this name only as a source-folder group. The main resources in this
        // group retain gramarye as the sole mod identity while making probe classes visible only
        // to the dedicated P4-A3 run.
        p4A3HeapProbe {
            sourceSet(sourceSets.main)
            sourceSet(p4A3ProbeSourceSet)
            sourceSet(p4A3GameTestSourceSet)
        }

        p4B2HeapProbe {
            sourceSet(sourceSets.main)
            sourceSet(p4A3ProbeSourceSet)
            sourceSet(p4B2ProbeSourceSet)
            sourceSet(p4B2GameTestSourceSet)
        }

        p4C2HeapProbe {
            sourceSet(sourceSets.main)
            sourceSet(p4C2ProbeSourceSet)
            sourceSet(p4C2GameTestSourceSet)
        }
    }

    def productionMod = mods.named(project.mod_id).get()
    def p4A3ProbeTestMod = mods.named('p4A3ProbeTestSupport').get()
    def p4A3ProbeMod = mods.named('p4A3HeapProbe').get()
    def p4B2ProbeMod = mods.named('p4B2HeapProbe').get()
    def p4C2ProbeMod = mods.named('p4C2HeapProbe').get()

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file(serverGameDirectory.get())
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            // The P0 smoke test uses Minecraft's built-in one-block air structure.
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
        }

        p4A3HeapProbeServer {
            type = 'gameTestServer'
            sourceSet = p4A3GameTestSourceSet
            gameDirectory = project.file('run/p4-a3-heap-probe')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_a3'
            jvmArguments.addAll(
                    '-Xms512m',
                    '-Xmx1024m',
                    '-XX:+ExitOnOutOfMemoryError')
            disableIdeRun()
            taskBefore(tasks.named(p4A3GameTestSourceSet.classesTaskName))
        }

        p4B2HeapLoadSaveServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/full-world').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_b2'
            systemProperty 'gramarye.p4b2.runMode', 'full-first-load-save'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4B2HeapRestartServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/full-world').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_b2'
            systemProperty 'gramarye.p4b2.runMode', 'full-restart'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4B2HostileFnameServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/full-hostile-fname').get().asFile
