            systemProperty 'gramarye.p4b2.runMode', 'hostile-fname-first'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4B2HostileFnameRestartServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/full-hostile-fname').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_b2'
            systemProperty 'gramarye.p4b2.runMode', 'hostile-fname-restart'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4B2MalformedServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/invalid-malformed').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_b2'
            systemProperty 'gramarye.p4b2.runMode', 'malformed-first'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4B2MalformedRestartServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/invalid-malformed').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_b2'
            systemProperty 'gramarye.p4b2.runMode', 'malformed-restart'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4B2TrailingServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/invalid-trailing').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_b2'
            systemProperty 'gramarye.p4b2.runMode', 'trailing-first'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4B2TrailingRestartServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/invalid-trailing').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_b2'
            systemProperty 'gramarye.p4b2.runMode', 'trailing-restart'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4B2SecondMemberServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/invalid-second-member').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_b2'
            systemProperty 'gramarye.p4b2.runMode', 'second-member-first'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4B2SecondMemberRestartServer {
            type = 'gameTestServer'
            sourceSet = p4B2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-b2/invalid-second-member').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_b2'
            systemProperty 'gramarye.p4b2.runMode', 'second-member-restart'
            jvmArguments.addAll(p4B2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4B2GameTestSourceSet.classesTaskName))
        }

        p4C2ReadyServer {
            type = 'gameTestServer'
            sourceSet = p4C2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-c2/ready-world').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_c2'
            systemProperty 'gramarye.p4c2.runMode', 'ready-first'
            jvmArguments.addAll(p4C2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4C2GameTestSourceSet.classesTaskName))
        }

        p4C2ReadyRestartServer {
            type = 'gameTestServer'
            sourceSet = p4C2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-c2/ready-world').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_c2'
            systemProperty 'gramarye.p4c2.runMode', 'ready-restart'
            jvmArguments.addAll(p4C2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4C2GameTestSourceSet.classesTaskName))
        }

        p4C2PreservedRawServer {
            type = 'gameTestServer'
            sourceSet = p4C2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-c2/preserved-raw-world').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_c2'
