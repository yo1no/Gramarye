                p4E0R2QConfiguredFormalRunNames.add(formalRunName)
                create(formalRunName) {
                    type = 'gameTestServer'
                    sourceSet = p4E0ResearchGameTestSourceSet
                    gameDirectory = formalCaseDirectory.dir('game').asFile
                    systemProperty 'neoforge.enabledGameTestNamespaces',
                            'gramarye_p4_e0_research'
                    systemProperty 'gramarye.p4e0.research.runMode', 'r2q-formal'
                    systemProperty 'gramarye.p4e0.r2q.formal.enabled', 'true'
                    systemProperty 'gramarye.p4e0.r2q.formal.caseIndex',
                            formalCaseIndex.toString()
                    systemProperty 'gramarye.p4e0.r2q.formal.studyControl',
                            p4E0R2QFormalWorkDirectory.get()
                                    .file('study-control.json').asFile.absolutePath
                    systemProperty 'gramarye.p4e0.r2q.formal.caseRoot',
                            formalCaseDirectory.asFile.absolutePath
                    systemProperty 'gramarye.p4e0.r2q.formal.childResult',
                            formalCaseDirectory.file('child-result.json').asFile.absolutePath
                    systemProperty 'gramarye.p4e0.r2q.formal.runningMarker',
                            formalCaseDirectory.file('running.marker').asFile.absolutePath
                    systemProperty 'gramarye.p4e0.r2q.formal.watchdogSeconds',
                            p4E0R2QFormalWatchdogSeconds.toString()
                    systemProperty 'gramarye.p4e0.r2q.formal.diskBudgetBytes',
                            p4E0R2QFormalDiskBudgetBytes
                    jvmArguments.addAll(p4E0R2QFormalJvmArgs)
                    disableIdeRun()
                    taskBefore(tasks.named(p4E0ResearchGameTestSourceSet.classesTaskName))
                }
        }

        p4E0ResearchR2CombinedCoordinates.each { coordinate ->
                def researchRunIndex = coordinate['researchIndex'] as int
                def profileId = coordinate['profileId'] as String
                def profileToken = coordinate['profileToken'] as String
                def heapMiB = coordinate['heapMiB'] as int
                def runName =
                        "p4E0ResearchCombined${profileToken}${heapMiB}".toString()
                def evidenceStem = String.format(
                        java.util.Locale.ROOT,
                        '%04d-f-combined-%s-%d',
                        researchRunIndex,
                        profileId.toLowerCase(java.util.Locale.ROOT),
                        heapMiB)
                p4E0ResearchR2ConfiguredCombinedRunNames.add(runName)
                create(runName) {
                    type = 'gameTestServer'
                    sourceSet = p4E0ResearchGameTestSourceSet
                    gameDirectory = layout.buildDirectory.dir(
                            "p4-e0-research/r2/combined-worlds/${profileId}-${heapMiB}")
                            .get().asFile
                    systemProperty 'neoforge.enabledGameTestNamespaces',
                            'gramarye_p4_e0_research'
                    systemProperty 'gramarye.p4e0.research.fixtureRoot',
                            layout.buildDirectory.dir('p4-e0-research')
                                    .get().asFile.absolutePath
                    systemProperty 'gramarye.p4e0.research.reportRoot',
                            layout.buildDirectory.dir('reports/p4-e0-research')
                                    .get().asFile.absolutePath
                    systemProperty 'gramarye.p4e0.research.runMode', 'r2-combined'
                    systemProperty 'gramarye.p4e0.research.runIndex',
                            researchRunIndex.toString()
                    systemProperty 'gramarye.p4e0.research.heapMiB', heapMiB.toString()
                    systemProperty 'gramarye.p4e0.research.profile', profileId
                    systemProperty 'gramarye.p4e0.research.diskBudgetBytes',
                            p4E0ResearchDiskBudgetBytes
                    systemProperty 'gramarye.p4e0.gitHead',
                            p4E0ResearchGitHead.get()
                    systemProperty 'gramarye.p4e0.research.childReport',
                            layout.buildDirectory.file(
                                    "reports/p4-e0-research/combined-child/${evidenceStem}.json")
                                    .get().asFile.absolutePath
                    systemProperty 'gramarye.p4e0.research.runningMarker',
                            layout.buildDirectory.file(
                                    "reports/p4-e0-research/combined-running/${evidenceStem}.marker")
                                    .get().asFile.absolutePath
                    systemProperty 'gramarye.p4e0.research.exitFile',
                            layout.buildDirectory.file(
                                    "reports/p4-e0-research/process/"
                                            + "${researchRunIndex}.exit-code.txt")
                                    .get().asFile.absolutePath
                    systemProperty 'gramarye.p4e0.research.watchdogSeconds', '870'
                    jvmArguments.addAll([
                            '-Xms512m',
                            "-Xmx${heapMiB}m",
                            '-XX:+ExitOnOutOfMemoryError',
                    ])
                    disableIdeRun()
                    taskBefore(tasks.named(p4E0ResearchGameTestSourceSet.classesTaskName))
                }
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            loadedMods.set([name == 'p4A3HeapProbeServer'
                    ? p4A3ProbeMod
                    : name.startsWith('p4B2') ? p4B2ProbeMod
                    : name.startsWith('p4C2') ? p4C2ProbeMod
                    : name.startsWith('p4D3') ? p4D3ProbeMod
                    : name.startsWith('p4E3') ? p4E3GameTestMod
                    : (name == 'p4E0ResearchDedicatedSmoke'
                            || name == 'p4E0R2QDedicatedSmoke'
                            || name == 'p4E0R2QRunnerDedicatedSmoke'
                            || name.startsWith('p4E0ResearchCombined')
                            || p4E0R2QConfiguredFormalRunNames.contains(name))
                            ? p4E0ResearchMod : productionMod])

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    unitTest {
        enable()
        testedMod = p4A3ProbeTestMod
        loadedMods.set([p4A3ProbeTestMod])
    }
}

