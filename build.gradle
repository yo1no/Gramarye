        }

        p4C2PreservedRawRestartServer {
            type = 'gameTestServer'
            sourceSet = p4C2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-c2/preserved-raw-world').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_c2'
            systemProperty 'gramarye.p4c2.runMode', 'preserved-raw-restart'
            jvmArguments.addAll(p4C2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4C2GameTestSourceSet.classesTaskName))
        }

        p4C2OversizeServer {
            type = 'gameTestServer'
            sourceSet = p4C2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-c2/oversize-world').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_c2'
            systemProperty 'gramarye.p4c2.runMode', 'oversize-first'
            jvmArguments.addAll(p4C2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4C2GameTestSourceSet.classesTaskName))
        }

        p4C2OversizeRestartServer {
            type = 'gameTestServer'
            sourceSet = p4C2GameTestSourceSet
            gameDirectory = layout.buildDirectory.dir('p4-c2/oversize-world').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gramarye_p4_c2'
            systemProperty 'gramarye.p4c2.runMode', 'oversize-restart'
            jvmArguments.addAll(p4C2FixedHeapJvmArgs)
            disableIdeRun()
            taskBefore(tasks.named(p4C2GameTestSourceSet.classesTaskName))
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            loadedMods.set([name == 'p4A3HeapProbeServer'
                    ? p4A3ProbeMod
                    : name.startsWith('p4B2') ? p4B2ProbeMod
                    : name.startsWith('p4C2') ? p4C2ProbeMod : productionMod])

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    unitTest {
        enable()
        testedMod = p4A3ProbeTestMod
        loadedMods.set([p4A3ProbeTestMod])
    }
}

// The dedicated-server smoke harness sends the normal `stop` command through stdin.
tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    p4B2PackagedServerInstaller {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def p4B2PackagedServerInstallerConfiguration =
        configurations.named('p4B2PackagedServerInstaller')

dependencies {
    jarJar(implementation(commonsCompressCoordinate)) {
        version {
            strictly "[${commonsCompressVersion}]"
            prefer commonsCompressVersion
        }
    }
    additionalRuntimeClasspath commonsCompressCoordinate
    add(
            'p4B2PackagedServerInstaller',
            "net.neoforged:neoforge:${neo_version}:installer")

    add(p4A3ProbeSourceSet.implementationConfigurationName, sourceSets.main.output)
    add(p4A3GameTestSourceSet.implementationConfigurationName, sourceSets.main.output)
    add(p4A3GameTestSourceSet.implementationConfigurationName, p4A3ProbeSourceSet.output)
    add(p4B2ProbeSourceSet.implementationConfigurationName, sourceSets.main.output)
    add(p4B2ProbeSourceSet.implementationConfigurationName, p4A3ProbeSourceSet.output)
    add(p4B2GameTestSourceSet.implementationConfigurationName, sourceSets.main.output)
    add(p4B2GameTestSourceSet.implementationConfigurationName, p4A3ProbeSourceSet.output)
    add(p4B2GameTestSourceSet.implementationConfigurationName, p4B2ProbeSourceSet.output)
    add(p4C2ProbeSourceSet.implementationConfigurationName, sourceSets.main.output)
    add(p4C2GameTestSourceSet.implementationConfigurationName, sourceSets.main.output)
    add(p4C2GameTestSourceSet.implementationConfigurationName, p4C2ProbeSourceSet.output)
    testImplementation p4A3ProbeSourceSet.output
    testImplementation p4B2ProbeSourceSet.output
    testImplementation p4C2ProbeSourceSet.output

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

def p4A3JavaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}
def p4A3FixedHeapJvmArgs = [
        '-Xms512m',
        '-Xmx1024m',
        '-XX:+ExitOnOutOfMemoryError',
]
def registerP4A3HeapProbe = { String taskName, String workload ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs the P4-A3 ${workload} Store carrier probe in a fixed-heap JVM."
        dependsOn(tasks.named(p4A3ProbeSourceSet.classesTaskName))
        javaLauncher.set(p4A3JavaLauncher)
        classpath = p4A3ProbeSourceSet.runtimeClasspath
        mainClass.set('com.yo1no.gramarye.magic.definition.store.P4A3HeapProbeMain')
        args(workload)
        jvmArgs(p4A3FixedHeapJvmArgs)
        timeout.set(java.time.Duration.ofSeconds(180))
        inputs.property('p4A3Workload', workload)
    }
}
def p4A3ManySmallTask = registerP4A3HeapProbe(
        'p4A3HeapProbeManySmall', 'many-small')
def p4A3NearEntryTask = registerP4A3HeapProbe(
        'p4A3HeapProbeNearEntry', 'near-entry')
def p4A3MixedTask = registerP4A3HeapProbe(
        'p4A3HeapProbeMixed', 'mixed')
p4A3NearEntryTask.configure { mustRunAfter(p4A3ManySmallTask) }
p4A3MixedTask.configure { mustRunAfter(p4A3NearEntryTask) }

tasks.register('p4A3HeapProbe') {
    group = 'verification'
    description = 'Runs every plain P4-A3 fixed-heap Store carrier probe.'
    dependsOn(p4A3ManySmallTask, p4A3NearEntryTask, p4A3MixedTask)
}

tasks.named('runP4A3HeapProbeServer', JavaExec).configure {
    javaLauncher.set(p4A3JavaLauncher)
    timeout.set(java.time.Duration.ofSeconds(300))
}

def verifyP4A3BConfiguration = tasks.register(
        'verifyP4A3BConfiguration', Exec) {
    group = 'verification'
    description = 'Verifies P4-A3 probe task, source-set, CI, and production-JAR isolation.'
    dependsOn(
            tasks.named('jar'),
            tasks.named(p4A3ProbeSourceSet.classesTaskName),
            tasks.named(p4A3GameTestSourceSet.classesTaskName))

    inputs.file(layout.projectDirectory.file('build.gradle'))
    inputs.file(layout.projectDirectory.file('.github/workflows/build.yml'))
    inputs.files(fileTree('src/main/java') { include '**/*.java' })
    inputs.files(fileTree('src/p4A3Probe/java') { include '**/*.java' })
    inputs.files(fileTree('src/p4A3GameTest/java') { include '**/*.java' })
    workingDir(layout.projectDirectory)
    commandLine(
            'bash',
            layout.projectDirectory.file(
                    'scripts/verify-p4-a3-b-configuration.sh').asFile.absolutePath)
}

