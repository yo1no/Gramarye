@groovy.transform.CompileStatic
@groovy.transform.stc.POJO
class ProbeRuntimeWorkingDirectoryAction
        implements org.gradle.api.Action<org.gradle.api.Task>, java.io.Serializable {
    private static final long serialVersionUID = 1L

    private final String projectRootPathText
    private final String buildRootPathText
    private final String taskNameText
    private final String taskDirectoryPathText

    ProbeRuntimeWorkingDirectoryAction(
            String projectRootPathText,
            String buildRootPathText,
            String taskNameText,
            String taskDirectoryPathText) {
        if (projectRootPathText == null
                || buildRootPathText == null
                || taskNameText == null
                || taskDirectoryPathText == null) {
            throw new IllegalArgumentException('Probe runtime path text must not be null')
        }
        this.projectRootPathText = projectRootPathText
        this.buildRootPathText = buildRootPathText
        this.taskNameText = taskNameText
        this.taskDirectoryPathText = taskDirectoryPathText
    }

    @Override
    void execute(org.gradle.api.Task ignored) {
        if (taskNameText.isBlank()
                || taskNameText.indexOf(0) >= 0
                || taskNameText.contains('/')
                || taskNameText.contains('\\')
                || taskNameText.contains('..')) {
            throw new org.gradle.api.GradleException(
                    "Invalid ProbeMain task-name leaf: ${taskNameText}")
        }

        java.nio.file.Path taskNamePath
        try {
            taskNamePath = java.nio.file.Paths.get(taskNameText)
        } catch (RuntimeException failure) {
            throw new org.gradle.api.GradleException(
                    "Invalid ProbeMain task-name path: ${taskNameText}", failure)
        }
        if (taskNamePath.isAbsolute()
                || taskNamePath.getNameCount() != 1
                || taskNamePath.getFileName().toString() != taskNameText) {
            throw new org.gradle.api.GradleException(
                    "ProbeMain task name is not one exact leaf: ${taskNameText}")
        }

        java.nio.file.Path projectRoot = normalizedAbsolute(projectRootPathText)
        java.nio.file.Path buildRoot = normalizedAbsolute(buildRootPathText)
        java.nio.file.Path probeRoot = buildRoot.resolve('probe-runtime-working').normalize()
        java.nio.file.Path taskDirectory = normalizedAbsolute(taskDirectoryPathText)
        java.nio.file.Path expectedTaskDirectory = probeRoot.resolve(taskNameText).normalize()

        if (buildRoot == projectRoot
                || !buildRoot.startsWith(projectRoot)
                || probeRoot.getParent() != buildRoot
                || taskDirectory != expectedTaskDirectory
                || taskDirectory.getParent() != probeRoot
                || taskDirectory.getFileName().toString() != taskNameText
                || taskDirectory == buildRoot
                || taskDirectory == probeRoot
                || taskDirectory == projectRoot
                || !taskDirectory.startsWith(probeRoot)) {
            throw new org.gradle.api.GradleException(
                    "Unsafe ProbeMain working-directory boundary: ${taskNameText}")
        }

        requireDirectoryOrAbsent(buildRoot, 'build root')
        requireDirectoryOrAbsent(probeRoot, 'probe root')
        if (java.nio.file.Files.exists(
                    taskDirectory, java.nio.file.LinkOption.NOFOLLOW_LINKS)
                && java.nio.file.Files.isSymbolicLink(taskDirectory)) {
            throw new org.gradle.api.GradleException(
                    "ProbeMain task directory is a symbolic link: ${taskNameText}")
        }

        try {
            if (java.nio.file.Files.exists(
                    taskDirectory, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                java.nio.file.Files.walkFileTree(
                        taskDirectory,
                        java.util.EnumSet.noneOf(java.nio.file.FileVisitOption.class),
                        Integer.MAX_VALUE,
                        new java.nio.file.SimpleFileVisitor<java.nio.file.Path>() {
                            @Override
                            java.nio.file.FileVisitResult visitFile(
                                    java.nio.file.Path file,
                                    java.nio.file.attribute.BasicFileAttributes attributes)
                                    throws java.io.IOException {
                                java.nio.file.Files.delete(file)
                                return java.nio.file.FileVisitResult.CONTINUE
                            }

                            @Override
                            java.nio.file.FileVisitResult visitFileFailed(
                                    java.nio.file.Path file,
                                    java.io.IOException failure)
                                    throws java.io.IOException {
                                throw failure
                            }

                            @Override
                            java.nio.file.FileVisitResult postVisitDirectory(
                                    java.nio.file.Path directory,
                                    java.io.IOException failure)
                                    throws java.io.IOException {
                                if (failure != null) {
                                    throw failure
                                }
                                java.nio.file.Files.delete(directory)
                                return java.nio.file.FileVisitResult.CONTINUE
                            }
                        })
            }
            if (java.nio.file.Files.exists(
                    taskDirectory, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                throw new org.gradle.api.GradleException(
                        "ProbeMain task directory survived exact deletion: ${taskNameText}")
            }
            java.nio.file.Files.createDirectories(taskDirectory)
        } catch (java.io.IOException failure) {
            throw new org.gradle.api.GradleException(
                    "ProbeMain task directory rebuild failed: ${taskNameText}", failure)
        }

        requireExistingDirectory(buildRoot, 'build root')
        requireExistingDirectory(probeRoot, 'probe root')
        requireExistingDirectory(taskDirectory, 'task directory')
    }

    private static java.nio.file.Path normalizedAbsolute(String pathText) {
        try {
            return java.nio.file.Paths.get(pathText).toAbsolutePath().normalize()
        } catch (RuntimeException failure) {
            throw new org.gradle.api.GradleException(
                    "Invalid ProbeMain runtime path: ${pathText}", failure)
        }
    }

    private static void requireDirectoryOrAbsent(
            java.nio.file.Path directory, String label) {
        if (java.nio.file.Files.exists(
                    directory, java.nio.file.LinkOption.NOFOLLOW_LINKS)
                && (java.nio.file.Files.isSymbolicLink(directory)
                    || !java.nio.file.Files.isDirectory(
                            directory, java.nio.file.LinkOption.NOFOLLOW_LINKS))) {
            throw new org.gradle.api.GradleException(
                    "ProbeMain ${label} is not a safe directory")
        }
    }

    private static void requireExistingDirectory(
            java.nio.file.Path directory, String label) {
        if (java.nio.file.Files.isSymbolicLink(directory)
                || !java.nio.file.Files.isDirectory(
                        directory, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
            throw new org.gradle.api.GradleException(
                    "ProbeMain ${label} is unavailable after rebuild")
        }
    }
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

