        [])
prepareP4E0R2QFormalStudy.configure {
    dependsOn(verifyP4E0R2QConfiguration)
    doFirst {
        requireP4E0R2QFormalGate()
    }
}

def previousP4E0R2QFormalVerifier = prepareP4E0R2QFormalStudy
p4E0R2QFormalCaseIndices.each { formalCaseIndex ->
        def formalCaseToken = String.format(
                java.util.Locale.ROOT, '%02d', formalCaseIndex)
        def prepareCaseTaskName = "prepareP4E0R2QCase${formalCaseToken}".toString()
        def runCaseTaskName = "runP4E0R2QCase${formalCaseToken}".toString()
        def prepareRunTaskName = "prepareP4E0R2QCase${formalCaseToken}Run".toString()
        def writeClasspathTaskName =
                "writeP4E0R2QCase${formalCaseToken}LegacyClasspath".toString()
        def verifyCaseTaskName = "verifyP4E0R2QCase${formalCaseToken}".toString()
        def captureFailureTaskName =
                "captureP4E0R2QCase${formalCaseToken}ParentFailure".toString()
        def formalCaseDirectory = p4E0R2QFormalWorkDirectory.get().dir(
                "cases/${formalCaseToken}")
        def childResult = formalCaseDirectory.file('child-result.json')
        def verifiedResult = formalCaseDirectory.file('verified-result.json')
        def runningMarker = formalCaseDirectory.file('running.marker')
        def exitFile = formalCaseDirectory.file('exit-code.txt')
        def timeoutFile = formalCaseDirectory.file('timeout.marker')
        def parentDeadlineFile = formalCaseDirectory.file('parent-deadline.marker')
        def exitPathForFailureFinalizer =
                exitFile.asFile.toPath().toAbsolutePath().normalize().toString()
        def prerequisiteVerifier = previousP4E0R2QFormalVerifier
        p4E0R2QConfiguredFormalPrepareTaskNames.add(prepareCaseTaskName)
        p4E0R2QConfiguredFormalVerifyTaskNames.add(verifyCaseTaskName)
        p4E0R2QConfiguredFormalFailureTaskNames.add(captureFailureTaskName)

        def prepareCaseTask = registerP4E0R2QFormalCommand(
                prepareCaseTaskName,
                'prepare-case',
                "Creates and preflights formal R2Q case ${formalCaseToken} fixtures.",
                [formalCaseIndex.toString()])
        prepareCaseTask.configure {
            dependsOn(prerequisiteVerifier)
        }

        tasks.named(writeClasspathTaskName).configure {
            dependsOn(prepareCaseTask)
            outputs.upToDateWhen { false }
        }
        tasks.named(prepareRunTaskName).configure {
            dependsOn(prepareCaseTask)
            outputs.upToDateWhen { false }
        }

        def runCaseTask = tasks.named(runCaseTaskName, JavaExec)
        runCaseTask.configure {
            dependsOn(prepareCaseTask)
            javaLauncher.set(p4A3JavaLauncher)
            timeout.set(java.time.Duration.ofSeconds(p4E0R2QFormalTimeoutSeconds))
            ignoreExitValue = true
            doFirst {
                requireP4E0R2QFormalGate()
                def studyControl = p4E0R2QFormalWorkDirectory.get()
                        .file('study-control.json').asFile.toPath()
                if (!java.nio.file.Files.isRegularFile(
                                studyControl,
                                java.nio.file.LinkOption.NOFOLLOW_LINKS)
                        || java.nio.file.Files.isSymbolicLink(studyControl)
                        || java.nio.file.Files.size(studyControl) > 131_072L) {
                    throw new GradleException(
                            'P4-E0-R2Q formal study control is absent or unbounded')
                }
                [childResult, verifiedResult, runningMarker, exitFile, timeoutFile,
                        parentDeadlineFile]
                        .each { output ->
                    if (java.nio.file.Files.exists(
                            output.asFile.toPath(),
                            java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                        throw new GradleException(
                                'P4-E0-R2Q refused stale per-case process evidence')
                    }
                    output.asFile.parentFile.mkdirs()
                }
                def parentDeadlineMillis = Math.addExact(
                        System.currentTimeMillis(),
                        Math.multiplyExact(
                                p4E0R2QFormalTimeoutSeconds as long, 1_000L))
                writeForcedP4E0R2QProcessMarker(
                        parentDeadlineFile.asFile,
                        "deadline_epoch_millis=${parentDeadlineMillis}\n".toString())
            }
            doLast {
                writeForcedP4E0R2QProcessMarker(
                        exitFile.asFile,
                        executionResult.get().exitValue.toString()
                                + '\n')
            }
            outputs.upToDateWhen { false }
        }

        def captureFailureTask = registerP4E0R2QFormalCommand(
                captureFailureTaskName,
                'capture-failure',
                "Preserves bounded parent-failure evidence for formal R2Q case ${formalCaseToken}.",
                [formalCaseIndex.toString(), 'AUTO_PARENT'])
        captureFailureTask.configure {
            onlyIf {
                !java.nio.file.Files.exists(
                        java.nio.file.Path.of(exitPathForFailureFinalizer),
                        java.nio.file.LinkOption.NOFOLLOW_LINKS)
            }
        }
        runCaseTask.configure {
            finalizedBy(captureFailureTask)
        }

        def verifyCaseTask = registerP4E0R2QFormalCommand(
                verifyCaseTaskName,
                'verify-case',
                "Classifies, preserves, and cleans formal R2Q case ${formalCaseToken}.",
                [formalCaseIndex.toString()])
        verifyCaseTask.configure {
            dependsOn(runCaseTask)
        }
        previousP4E0R2QFormalVerifier = verifyCaseTask
}

